# CI uses only free resources: no API keys, no paid services, no live market
# data (tests run on deterministic fixtures).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ARGUS_TEST_POSTGRES_URL: postgresql+psycopg://argus:argus@localhost:5432/argus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint
        run: ruff check app tests evals migrations/env.py
      - name: Tests (offline, includes SQLite + PostgreSQL migration checks)
        run: pytest -q
      - name: Migration drift check
        run: alembic upgrade head && alembic check
        env:
          ARGUS_DATABASE_URL: sqlite+aiosqlite:///./ci.db
      - name: Research evaluation (offline)
        run: python -m evals.research_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  e2e:
    # Real UI + real backend on deterministic fixture data (no network, no model).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -c constraints.txt
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run export:backend
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t argus:ci .
